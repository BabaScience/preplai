server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Audio metadata — short cache so new showcases propagate quickly
    location = /audio/showcase/metadata.json {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    # Pre-generated audio MP3s — immutable, cache for 1 year
    location /audio/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Vite hashed assets — immutable, cache for 1 year
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Pre-rendered SSG HTML — short cache so re-deploys propagate quickly.
    # try_files checks: exact file → directory index → SPA fallback.
    # Pre-rendered routes (e.g. /docs/quick-start/) resolve via $uri/ to their
    # own index.html before hitting the fallback, giving crawlers unique HTML.
    location / {
        try_files $uri $uri/ /index.html;
        # Don't cache HTML — ensures crawlers and browsers always get the
        # freshest pre-rendered head tags after a deployment.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
