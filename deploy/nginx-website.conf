server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Pre-generated audio — immutable, cache for 1 year
    location /audio/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Vite hashed assets — immutable, cache for 1 year
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
