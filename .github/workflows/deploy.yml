# .github/workflows/deploy.yml
# CD: deploys to Droplet on push to main (or on tag v*)
# Requires GitHub secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY
# If key is passphrase-protected, also add: VPS_SSH_KEY_PASSPHRASE

name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:  # Allow manual trigger

env:
  APP_DIR: /opt/preplai

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://preplai.com

    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
          port: 22
          envs: GITHUB_REPOSITORY,GITHUB_TOKEN
          script: |
            set -euo pipefail
            APP_DIR="${{ env.APP_DIR }}"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "==> Cloning repository (first-time setup)..."
              rm -rf "$APP_DIR"
              mkdir -p "$(dirname "$APP_DIR")"
              git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$APP_DIR"
            fi

            cd "$APP_DIR"
            echo "==> Pulling latest from main..."
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git fetch origin
            git reset --hard origin/main

            echo "==> Building and starting..."
            docker compose build --no-cache
            docker compose up -d

            echo "==> Reloading nginx..."
            docker exec preplai-nginx nginx -t 2>/dev/null && docker exec preplai-nginx nginx -s reload 2>/dev/null || true

            echo "==> Deploy complete: $(git rev-parse --short HEAD)"

      - name: Health check
        run: |
          sleep 10
          for url in https://api.preplai.com/health https://player.preplai.com/health; do
            if curl -sf --max-time 15 "$url" >/dev/null; then
              echo "OK: $url"
            else
              echo "WARN: $url not responding"
              exit 1
            fi
          done
