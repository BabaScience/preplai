# .github/workflows/eval-golden.yml
# Runs golden dataset eval when tool descriptions change.
# Requires ANTHROPIC_API_KEY secret. Optionally uses OPENAI_API_KEY.
# Skipped on forks.

name: Golden Dataset Eval

on:
  pull_request:
    paths:
      - 'packages/mcp-server/src/tool-descriptions/**'
      - 'packages/mcp-server/src/mcp-tools.ts'
      - 'tests/golden-dataset/prompts.json'

concurrency:
  group: eval-golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Evaluate Tool Descriptions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip on forks (no secrets available)
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages

      - name: Run golden dataset eval
        id: eval
        run: |
          pnpm run eval:golden 2>&1 | tee eval-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Post results as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = 'No output captured';
            try {
              output = fs.readFileSync('eval-output.txt', 'utf8');
            } catch (e) {
              output = 'Failed to read eval output';
            }

            // Truncate if too long
            const maxLen = 60000;
            if (output.length > maxLen) {
              output = output.slice(0, maxLen) + '\n... (truncated)';
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🎯 Golden Dataset Eval Results\n\n\`\`\`\n${output}\n\`\`\`\n\n_Triggered by tool description changes_`,
            });
