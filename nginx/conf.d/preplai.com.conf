# preplai.com — reverse proxy for website, api, player
# SSL certs: /etc/letsencrypt/live/preplai.com/

# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80;
    server_name preplai.com www.preplai.com api.preplai.com player.preplai.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Website — preplai.com
server {
    listen 443 ssl http2;
    server_name preplai.com www.preplai.com;
    ssl_certificate /etc/letsencrypt/live/preplai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preplai.com/privkey.pem;

    # Static audio files — aggressive caching (pre-generated, immutable content)
    location /audio/ {
        proxy_pass http://website:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static assets with hashed filenames (Vite output) — long cache
    location /assets/ {
        proxy_pass http://website:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://website:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API — api.preplai.com
server {
    listen 443 ssl http2;
    server_name api.preplai.com;
    ssl_certificate /etc/letsencrypt/live/preplai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preplai.com/privkey.pem;

    location / {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# MCP Server / Player — player.preplai.com
# CRITICAL: SSE requires proxy_buffering off and long timeouts
server {
    listen 443 ssl http2;
    server_name player.preplai.com;
    ssl_certificate /etc/letsencrypt/live/preplai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preplai.com/privkey.pem;

    # SSE endpoint — disable buffering, long timeout
    location ~ ^/session/[^/]+/events$ {
        proxy_pass http://mcp:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
        gzip off;
    }

    location / {
        proxy_pass http://mcp:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
