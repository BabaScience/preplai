# docker-compose.yml — preplai full stack (preplai.com)
# Run: docker compose up -d
# Requires: .env with MONGODB_URI, JWT_SECRET
# SSL: certs at /etc/letsencrypt (bind mount or symlink)

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: preplai-api
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: https://preplai.com,https://www.preplai.com,https://player.preplai.com
      PLAYER_BASE_URL: https://player.preplai.com
      MCP_BASE_URL: http://mcp:5005
      NODE_ENV: production
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Preplai <onboarding@resend.dev>}
      APP_URL: ${APP_URL:-https://preplai.com}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - preplai-net

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: preplai-mcp
    restart: unless-stopped
    environment:
      PORT: 5005
      HOST: 0.0.0.0
      BASE_URL: https://player.preplai.com
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: https://preplai.com,https://www.preplai.com,https://api.preplai.com,https://player.preplai.com
      NODE_ENV: production
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5005/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - preplai-net

  website:
    build:
      context: .
      dockerfile: Dockerfile.website
      args:
        VITE_API_URL: https://api.preplai.com/api
    container_name: preplai-website
    restart: unless-stopped
    networks:
      - preplai-net

  nginx:
    image: nginx:alpine
    container_name: preplai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
      website:
        condition: service_started
    networks:
      - preplai-net

networks:
  preplai-net:
    driver: bridge
