# Alertmanager configuration for Preplai
# Default receiver logs to stdout. Add Slack/email webhooks as needed.

global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'default'
    # Add webhook_configs, slack_configs, or email_configs here:
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/...'
    #     channel: '#alerts'
    #     send_resolved: true
