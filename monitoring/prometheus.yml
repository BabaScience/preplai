# Prometheus scrape config for Preplai API and MCP server
# Local dev: API on :5000, MCP on :5005
# Docker: use api:5000 and mcp:5005 (add Prometheus to docker-compose)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
        # Local dev (no Docker): use 'localhost:9093' instead

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: 'preplai-api'
    static_configs:
      - targets: ['api:5000']
        # Local dev (no Docker): use 'localhost:5000' instead
    metrics_path: /metrics

  - job_name: 'preplai-mcp'
    static_configs:
      - targets: ['mcp:5005']
        # Local dev (no Docker): use 'localhost:5005' instead
    metrics_path: /metrics
